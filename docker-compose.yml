services:
  api:
    build: .
    container_name: vendedor-ia-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: vendedor-ia-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    restart: unless-stopped
